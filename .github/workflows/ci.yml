name: CI

on:
  push:
    branches: [main, feature/roles-candidates]
  pull_request:
    branches: [main, feature/roles-candidates]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # build-arg equivalent to cloudbuild-web.yaml; CI only needs a build to succeed
          NEXT_PUBLIC_VOICE_PROVIDER: agent