name: Build & Deploy

on:
  push:
    branches: [dev]

env:
  PROJECT_ID: siva-nikhil
  REGION: asia-south1
  ZONE: asia-south1-a
  AR_REPO: asia-south1-docker.pkg.dev/siva-nikhil/meetingbot
  WEB_URL: https://meetingbot-web-199504026920.asia-south1.run.app
  PUBLIC_URL: https://interview.medhasacademy.com
  # (gcloud projects describe siva-nikhil --format='value(projectNumber)' → 199504026920)
  WIF_PROVIDER: projects/199504026920/locations/global/workloadIdentityPools/github-intervia/providers/github
  SA: 199504026920-compute@developer.gserviceaccount.com

jobs:
  # decide which images changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      agent: ${{ steps.f.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            web:
              - 'src/**'
              - 'Dockerfile.web'
              - 'package.json'
            agent:
              - 'agent/**'
              - 'Dockerfile.agent'
              - 'package.json'

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build & push web image
        run: |
          IMAGE=${{ env.AR_REPO }}/web:$GITHUB_SHA
          docker build -t "$IMAGE" -f Dockerfile.web --build-arg=NEXT_PUBLIC_VOICE_PROVIDER=cascade .
          docker push "$IMAGE"
          docker tag "$IMAGE" ${{ env.AR_REPO }}/web:latest
          docker push ${{ env.AR_REPO }}/web:latest
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy meetingbot-web \
            --project ${{ env.PROJECT_ID }} \
            --image ${{ env.AR_REPO }}/web:$GITHUB_SHA \
            --region ${{ env.REGION }} \
            --quiet

  build-agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build & push agent image
        run: |
          docker build -t ${{ env.AR_REPO }}/agent:latest -f agent/Dockerfile agent
          docker push ${{ env.AR_REPO }}/agent:latest
      - name: Deploy the per-interview interviewer job
        run: |
          # Each interview runs its own execution of this job; the token is no
          # longer dispatched to a worker on the agent VM. A running execution
          # keeps the image it started with, so this never cuts a live
          # interview: the next one picks up the new image.
          gcloud run jobs deploy intervia-agent \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.AR_REPO }}/agent:latest \
            --command /app/.venv/bin/python \
            --args main.py,one-shot \
            --execution-environment gen2 \
            --cpu 2 --memory 4Gi \
            --task-timeout 2h --max-retries 0 --tasks 1 \
            --set-env-vars INTERVIA_ONE_SHOT=1,AGENT_NAME=intervia-interviewer,AGENT_TTS_PROVIDER=cloud,NEXT_PUBLIC_VOICE_PROVIDER=cascade,NODE_ENV=production,INTERVIA_WEB_URL=${{ env.PUBLIC_URL }} \
            --set-secrets AGENT_API_SECRET=meetingbot-agent-api-secret:latest,GEMINI_API_KEY=meetingbot-gemini-api-key:latest,OMINIBOT_API_KEY=meetingbot-ominibot-api-key:latest,LIVEKIT_URL=meetingbot-livekit-url:latest,LIVEKIT_API_KEY=meetingbot-livekit-api-key:latest,LIVEKIT_API_SECRET=meetingbot-livekit-api-secret:latest \
            --quiet