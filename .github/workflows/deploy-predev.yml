name: Build & Deploy (predev)

# The predev stack: same code as feature/roles-candidates, its own Cloud Run
# services, database, bucket, queue and LiveKit agent name. Nothing here touches
# production tags (:latest) or restarts the production agent container.

on:
  push:
    branches: [features/predev]
  workflow_dispatch:

concurrency:
  group: predev-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: siva-nikhil
  REGION: asia-south1
  ZONE: asia-south1-a
  AR_REPO: asia-south1-docker.pkg.dev/siva-nikhil/meetingbot
  WIF_PROVIDER: projects/199504026920/locations/global/workloadIdentityPools/github-intervia/providers/github
  SA: 199504026920-compute@developer.gserviceaccount.com
  # One Cloud Run job execution per interview: started by the web app at the
  # email gate, it runs one interview on its own machine and exits.
  AGENT_JOB: intervia-predev-agent
  WEB_SERVICE: intervia-predev-web
  WORKER_SERVICE: intervia-predev-video-worker
  # Public URL written into shareable links. Request origins inside the
  # container are 0.0.0.0:8080, so it has to be stated explicitly.
  APP_BASE_URL: https://intervia-predev-web-199504026920.asia-south1.run.app

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      agent: ${{ steps.f.outputs.agent }}
      worker: ${{ steps.f.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            web:
              - 'src/**'
              - 'Dockerfile.web'
              - 'package.json'
              - 'video-analysis/**'
              - '.github/workflows/deploy-predev.yml'
            agent:
              - 'agent/**'
              - '.github/workflows/deploy-predev.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/deploy-predev.yml'

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build & push predev web image
        run: |
          IMAGE=${{ env.AR_REPO }}/web:predev
          docker build -t "$IMAGE" -f Dockerfile.web --build-arg=NEXT_PUBLIC_VOICE_PROVIDER=cascade .
          docker push "$IMAGE"
      - name: Deploy predev web
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --image ${{ env.AR_REPO }}/web:predev \
            --region ${{ env.REGION }} \
            --update-env-vars APP_BASE_URL=${{ env.APP_BASE_URL }},AGENT_JOB_NAME=${{ env.AGENT_JOB }},AGENT_JOB_PROJECT=${{ env.PROJECT_ID }},AGENT_JOB_REGION=${{ env.REGION }} \
            --update-secrets INTERNAL_SECRET=predev-internal-secret:latest \
            --quiet

  build-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build & push predev worker image
        run: |
          IMAGE=${{ env.AR_REPO }}/worker:predev
          docker build -t "$IMAGE" -f worker/Dockerfile .
          docker push "$IMAGE"
      - name: Deploy predev video worker
        run: |
          gcloud run deploy ${{ env.WORKER_SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --image ${{ env.AR_REPO }}/worker:predev \
            --region ${{ env.REGION }} \
            --cpu 2 --memory 4Gi --concurrency 1 --timeout 1800 \
            --update-env-vars INTERVIA_WEB_URL=https://${{ env.WEB_SERVICE }}-199504026920.${{ env.REGION }}.run.app \
            --update-secrets INTERNAL_SECRET=predev-internal-secret:latest \
            --quiet

  build-agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build & push predev agent image
        run: |
          IMAGE=${{ env.AR_REPO }}/agent:predev
          docker build -t "$IMAGE" -f agent/Dockerfile agent
          docker push "$IMAGE"
      - name: Deploy the per-interview interviewer job
        run: |
          # A running execution keeps the image it started with, so this never
          # interrupts a live interview; the next interview gets the new image.
          gcloud run jobs deploy ${{ env.AGENT_JOB }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.AR_REPO }}/agent:predev \
            --command /app/.venv/bin/python --args main.py,one-shot \
            --execution-environment gen2 \
            --cpu 2 --memory 4Gi \
            --task-timeout 2h --max-retries 0 --tasks 1 \
            --set-env-vars INTERVIA_ONE_SHOT=1,AGENT_NAME=predev-interviewer,AGENT_TTS_PROVIDER=cloud,NEXT_PUBLIC_VOICE_PROVIDER=cascade,NODE_ENV=production,INTERVIA_WEB_URL=${{ env.APP_BASE_URL }} \
            --set-secrets AGENT_API_SECRET=predev-agent-api-secret:latest,GEMINI_API_KEY=meetingbot-gemini-api-key:latest,OMINIBOT_API_KEY=meetingbot-ominibot-api-key:latest,LIVEKIT_URL=meetingbot-livekit-url:latest,LIVEKIT_API_KEY=meetingbot-livekit-api-key:latest,LIVEKIT_API_SECRET=meetingbot-livekit-api-secret:latest \
            --quiet
