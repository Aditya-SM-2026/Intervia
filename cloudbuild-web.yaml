# v2 web image. Separate image name from the earlier deployment (meetingbot/web)
# so building this never replaces what that service runs.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/court-siva-nikhil/meetingbot/web-v2:latest",
        "-f",
        "Dockerfile.web",
        ".",
      ]
images:
  - "asia-south1-docker.pkg.dev/court-siva-nikhil/meetingbot/web-v2:latest"
